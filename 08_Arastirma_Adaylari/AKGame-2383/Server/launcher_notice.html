<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <title>AK KO Launcher Duyurulari</title>
  <style>
    body {
      margin: 0;
      background: #13080a;
      color: #e8e2d2;
      font-family: Verdana, Arial, sans-serif;
      font-size: 14px;
    }
    .notice {
      padding: 14px 16px;
    }
    .title {
      color: #e2b868;
      font-weight: 700;
      letter-spacing: 0.08em;
      margin-bottom: 10px;
      text-transform: uppercase;
    }
    ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    li {
      margin: 8px 0;
      line-height: 1.35;
    }
    .icon {
      display: inline-block;
      width: 22px;
      color: #e2b868;
      text-align: center;
    }
    .accent {
      color: #ffcf67;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="notice">
    <div class="title" data-launcher-line data-icon="star">AK KO Duyurular</div>
<ul>
  <li data-launcher-line data-icon="alert"><span class="accent">AK KO</span> sistemleri aktif.</li>
  <li data-launcher-line data-icon="event">Etkinlik saatleri oyun icinden duyurulacak.</li>
  <li data-launcher-line data-icon="shield">Hile ve bug kullanimi kalici (HDD) ban sebebidir.</li>
  <li data-launcher-line data-icon="discord">Topluluk ve destek adresleri yakinda eklenecek.</li>
</ul>
  </div>
</body>
</html>
